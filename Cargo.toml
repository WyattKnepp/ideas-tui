[package]
name = "ideas-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.3"

[dev-dependencies]
wiremock = "0.6.5"
